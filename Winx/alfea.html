<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Winx Magic World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-winx.png">
    <link rel="icon" type="image/svg+xml" href="/img/logo-winx.png">
    <link rel="shortcut icon" href="/img/logo-winx.png">

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/container.css">
    <link rel="stylesheet" href="css/alfea.css">
    <script defer src="js/main.js"></script>
</head>
<body>
<div id="site-header"></div>
<main class="alfea">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <section class="hero">
        <div class="hero-text">
            <h1>Школа Алфея</h1>
            <p class="lead">Алфея — это не просто школа, это целый мир, где рождаются настоящие феи.</p>
            <p>Здесь учатся, растут и находят свою магию девушки со всего мира.
                В Алфее ты найдёшь друзей, откроешь свои способности и научишься использовать магию во благо.</p>
            <a class="btn" href="#topics">
                Узнать больше
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
        </div>

        <div class="hero-art">
            <svg class="castle" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                <defs>
                    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f5"/><stop offset="1" stop-color="#dff1ff"/></linearGradient>
                    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c9e4"/><stop offset="1" stop-color="#e3a8d4"/></linearGradient>
                </defs>
                <rect width="600" height="420" fill="url(#sky)"/>
                <ellipse cx="120" cy="80" rx="70" ry="20" fill="#fff" opacity=".8"/>
                <ellipse cx="470" cy="60" rx="80" ry="22" fill="#fff" opacity=".8"/>
                <path d="M0 300 Q150 230 300 290 T600 270 V420 H0Z" fill="#8fd36f"/>
                <g fill="url(#wall)">
                    <rect x="250" y="150" width="100" height="170"/>
                    <rect x="175" y="200" width="60" height="120"/>
                    <rect x="365" y="200" width="60" height="120"/>
                    <rect x="110" y="240" width="50" height="80"/>
                    <rect x="440" y="240" width="50" height="80"/>
                </g>
                <g fill="#4a7fd8">
                    <path d="M240 150 L300 40 L360 150Z"/>
                    <path d="M165 200 L205 120 L245 200Z"/>
                    <path d="M355 200 L395 120 L435 200Z"/>
                    <path d="M100 240 L135 175 L170 240Z"/>
                    <path d="M430 240 L465 175 L500 240Z"/>
                </g>
                <g fill="#6b3fd0">
                    <rect x="285" y="250" width="30" height="70" rx="15"/>
                    <rect x="195" y="250" width="20" height="40" rx="10"/>
                    <rect x="385" y="250" width="20" height="40" rx="10"/>
                </g>
                <g fill="#ffe27a"><circle cx="300" cy="190" r="9"/><circle cx="205" cy="225" r="6"/><circle cx="395" cy="225" r="6"/></g>
                <path d="M0 340 Q300 300 600 345 V420 H0Z" fill="#6bbf5a"/>
                <ellipse cx="300" cy="385" rx="140" ry="22" fill="#78c7f0" opacity=".85"/>
            </svg>
            <img src="https://i.pinimg.com/1200x/d0/31/51/d031518331c733b48bfc4f51b42abc05.jpg" alt="Школа Алфея" onerror="this.remove()">
        </div>
    </section>

    <section class="topics" id="topics" aria-label="Разделы об Алфее">
        <button class="topic" data-id="history">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12c-4-3-10-4-17-3v26c7-1 13 0 17 3 4-3 10-4 17-3V9c-7-1-13 0-17 3zM24 12v26"/></svg>
            <span>История Алфеи</span>
        </button>
        <button class="topic" data-id="students">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="15" r="6"/><circle cx="10" cy="19" r="4.5"/><circle cx="38" cy="19" r="4.5"/><path d="M13 38c0-7 5-11 11-11s11 4 11 11M2 36c0-5 3-8 8-8M46 36c0-5-3-8-8-8"/></svg>
            <span>Ученицы</span>
        </button>
        <button class="topic" data-id="teachers">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l5.5 11.5 12.5 1.7-9.2 8.7 2.3 12.4L24 33.200 12.900 39.300l2.300-12.400L6 18.200l12.500-1.700z"/></svg>
            <span>Преподаватели</span>
        </button>
        <button class="topic" data-id="items">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40L30 20M27 11l3-7 3 7 7 3-7 3-3 7-3-7-7-3zM8 14l1.500-3.500L13 9l-3.500-1.500L8 4 6.500 7.500 3 9l3.500 1.500zM38 34l1.200-2.800L42 30l-2.800-1.200L38 26l-1.200 2.800L34 30l2.800 1.200z"/></svg>
            <span>Магические предметы</span>
        </button>
        <button class="topic" data-id="places">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44S10 30 10 19a14 14 0 0 1 28 0c0 11-14 25-14 25z"/><circle cx="24" cy="19" r="5"/></svg>
            <span>Залы и локации</span>
        </button>
    </section>

    <section class="info" id="info" hidden aria-live="polite"></section>

    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#c9b6f5"/><stop offset=".5" stop-color="#f3b6e1"/><stop offset="1" stop-color="#b9a2ff"/></linearGradient></defs>
        <path d="M0 70 Q180 10 360 60 T720 55 T1080 60 T1440 40 V120 H0Z" fill="url(#wg)" opacity=".75"/>
        <path d="M0 95 Q240 50 480 90 T960 85 T1440 80 V120 H0Z" fill="#b69ced" opacity=".8"/>
    </svg>
</main>
<div class="footer"></div>

<script src="js/alfea.js"></script>
</body>
</html>
